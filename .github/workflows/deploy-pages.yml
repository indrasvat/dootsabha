name: Deploy Pages

# Production deploy for dootsabha.pages.dev: pages/ plus the repo-root
# install.sh, so `curl -fsSL https://dootsabha.pages.dev/install.sh | sh`
# serves the same installer the README documents. The Pages project is
# direct-upload, and this workflow's `--branch=production` is the only
# path to production.

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'install.sh'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Stage site and installer
        run: |
          mkdir deploy
          cp -R pages/. deploy/
          cp install.sh deploy/install.sh

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.153.0 pages deploy deploy --project-name=dootsabha --branch=production
