name: Deploy Pages Preview

# Preview deploy for PRs that touch the site; comments the preview URL on
# the PR. Secrets reach same-repo PRs only, so fork PRs skip the job. The
# preview branch is pr-<number>, never the head ref: a branch named
# "production" must not be able to publish to production.

on:
  pull_request:
    paths:
      - 'pages/**'
      - 'install.sh'
      - '.github/workflows/deploy-pages-preview.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Stage site and installer
        run: |
          mkdir deploy
          cp -R pages/. deploy/
          cp install.sh deploy/install.sh

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.153.0 pages deploy deploy \
            --project-name=dootsabha --branch="$BRANCH" | tee wrangler.log

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="$(grep -Eo 'https://[a-z0-9-]+\.dootsabha\.pages\.dev' wrangler.log | tail -1)"
          [[ -n "$url" ]] || { echo "no deployment URL in wrangler output"; exit 1; }
          gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none \
            --body "Pages preview: $url"
