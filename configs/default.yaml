# ─────────────────────────────────────────────────────────────
# दूतसभा (dootsabha) — Default Configuration
# ─────────────────────────────────────────────────────────────
#
# Override order: defaults → this file → env vars (DOOTSABHA_*) → CLI flags
#
# Env var convention: DOOTSABHA_{SECTION}_{KEY}
#   Example: DOOTSABHA_PROVIDERS_CLAUDE_MODEL=claude-opus-4-8
#
# Copy this file to ~/.config/dootsabha/config.yaml to customize.
# ─────────────────────────────────────────────────────────────

# Provider settings — one entry per AI agent backend.
# Each provider needs: binary (CLI executable name), model, flags.
providers:
  claude:
    binary: claude                    # CLI executable name (must be on $PATH)
    model: claude-opus-4-8            # Default model for invocations
    flags:                            # Flags passed to every invocation
      - --dangerously-skip-permissions
      - --no-session-persistence
  codex:
    binary: codex
    model: gpt-5.5
    flags:
      - --sandbox
      - danger-full-access
      - --ephemeral
      - --skip-git-repo-check
      - -c
      - model_reasoning_effort=medium
  agy:                                # Antigravity CLI — replaces the sunset Gemini CLI
    binary: agy
    model: Gemini 3.5 Flash (High)    # Display-name model id (see `agy models`)
    flags:
      - --dangerously-skip-permissions  # yolo equivalent — auto-approve tool permissions
  grok:                               # xAI Grok CLI — opt-in via --agent/--agents, not a council default
    binary: grok
    model: grok-4.5                   # Only model on the Grok subscription (see `grok models`)
    flags:
      - --reasoning-effort            # high | medium | low
      - high
    # Correctness-critical flags are PINNED by the provider and stripped from the
    # list above, so they cannot be overridden here:
    #   --output-format streaming-messages-json  (json's .text merges tool preambles)
    #   --sandbox read-only                      (containment; --cwd restricts nothing)
    #   --permission-mode bypassPermissions, --always-approve
    #   --no-plan, --no-subagents, --no-auto-update, -m
    # grok also runs with an isolated $HOME so it does not inherit the caller's
    # Claude Code harness (skills, hooks, MCP servers, CLAUDE.md).

# Council deliberation settings.
council:
  chair: claude       # Agent that synthesizes final output (fallback: first healthy non-chair)
  parallel: true      # Run dispatch phase in parallel (false = sequential)
  rounds: 1           # Number of deliberation rounds (max 5)

# Per-invocation timeout — the budget for ONE agent call. Every call in a
# pipeline gets its own window, so a slow author does not starve the reviewer.
# Formats: 30s, 5m, 1h. Set to 0 to fall back to the 5m built-in default.
timeout: 5m

# Session timeout — the ceiling for a WHOLE pipeline (review, refine, council),
# across every agent call it makes. It always wins over `timeout`: a call is cut
# short if the session budget runs out first.
#
# Checked between calls. A CLI that ignores SIGTERM gets a 5s grace period before
# it is killed, so a run can finish a few seconds past the ceiling — bounded by
# that one grace period, not by the number of calls.
# Formats: 30m, 1h, 2h. Set to 0 to disable the ceiling.
session_timeout: 30m
